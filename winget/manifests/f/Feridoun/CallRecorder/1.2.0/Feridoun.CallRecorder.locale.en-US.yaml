ShortDescription: Records both sides of calls and meetings and sends them to your Speakr server for transcripts and summaries.
Description: |-
  A small Windows tray app that records calls and online meetings (Teams, Zoom, Google Meet, WhatsApp, softphones) and uploads them to a self-hosted Speakr server for transcription and summaries.
  It records your microphone mixed with your PC's playback audio, so both sides are captured without a virtual audio cable. One hotkey (Ctrl+Alt+R) starts and stops recording. Recordings are written to disk as they're made, uploads are retried while offline, and Sensitive mode keeps a recording on the PC only.
